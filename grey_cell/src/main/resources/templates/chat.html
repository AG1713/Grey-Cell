<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Grey Cell Chat</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .sidebar { height: 100vh; overflow-y: auto; }
        .chat-window { height: 85vh; overflow-y: auto; padding: 1rem; border: 1px solid #ddd; border-radius: .25rem; }
    </style>
</head>
<body>
<div class="container-fluid">
    <div class="row">
        <!-- Sidebar: Discussions -->
        <div class="col-3 border-end sidebar">
            <h5 class="mt-3">Discussions</h5>
            <ul class="list-group">
                <li th:each="d : ${discussions}"
                    th:classappend="${d.id} == ${currentDiscussionId} ? 'active' : ''"
                    class="list-group-item list-group-item-action">
                    <a th:href="@{'/frontend/chat/' + ${d.id}}"
                       th:text="${d.name}"
                       class="text-decoration-none text-reset d-block"></a>
                </li>
            </ul>
        </div>

        <!-- Main Chat Area -->
        <div class="col-9 d-flex flex-column">
            <div id="messages" class="chat-window mb-3">
                <div th:each="m : ${messages}">
                    <div><strong th:text="${m.author}">Author</strong>
                        <small class="text-muted" th:text="${#dates.format(m.timestamp, 'HH:mm:ss')}">Time</small>
                    </div>
                    <div th:text="${m.content}">Message content</div>
                    <hr/>
                </div>
            </div>

            <!-- Input Box -->
            <form id="messageForm" autocomplete="off" autocorrect="off" onsubmit="sendMessage()">
                <div class="input-group mb-4">
                    <input type="hidden" id="currentDiscussionId" th:value="@{currentDiscussionId}">
                    <input type="hidden" id="provider" value="gemini">
                    <input type="text" id="userInput" class="form-control" placeholder="Type your message..." autocomplete="off" autocorrect="off" required>
                    <button class="btn btn-primary" type="submit">Send</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Bootstrap JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:inline="javascript">
    /*<![CDATA[*/

    window.onload = function () {
        const container = document.getElementById("messages");
        if (container) {
            container.scrollTo({
                top: container.scrollHeight
            });
        }
    };

    function sendMessage() {
        const input = document.getElementById('userInput');
        const message = encodeURIComponent(input.value);
        console.log(message);
        const discussionId = /*[[${currentDiscussionId}]]*/ 0;
        const provider = document.getElementById('provider').value;

        fetch(`/grey_cell/send_message?id=${discussionId}&prompt=${message}&provider=${provider}`)
            .then(response => {
                input.value = '';
                return response.text();
            })
    }
    /*]]>*/
</script>
</body>
</html>
